<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alternativa Tecnológica</title>

<style>

:root{
  --azul:#3f7ad8;
  --azul2:#275db7;
  --violeta:#7b57d8;
  --blanco:#ffffff;
  --gris:#f4f6fb;
  --texto:#1f2937;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Segoe UI,Arial,sans-serif;
  background:var(--gris);
  color:var(--texto);
}

header{
 background:linear-gradient(135deg,var(--azul),var(--violeta));
 color:white;
 text-align:center;
 padding:50px 20px;
}

.logo{
 width:180px;
 max-width:90%;
 margin-bottom:15px;
}

header h1{
 font-size:clamp(2rem,5vw,3.5rem);
 margin-bottom:10px;
}

header p{
 font-size:1.2rem;
 opacity:.95;
}

nav{
 background:white;
 padding:15px;
 display:flex;
 justify-content:center;
 gap:20px;
 flex-wrap:wrap;
 box-shadow:0 2px 6px rgba(0,0,0,.1);
 position:sticky;
 top:0;
 z-index:100;
}

nav a{
 color:var(--azul2);
 text-decoration:none;
 font-weight:600;
}

section{
 max-width:1200px;
 margin:auto;
 padding:50px 20px;
}

.titulo{
 text-align:center;
 margin-bottom:30px;
 font-size:2rem;
 color:var(--azul2);
}

.card{
 background:white;
 padding:25px;
 border-radius:15px;
 box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.boton{
 display:inline-block;
 margin-top:20px;
 background:linear-gradient(135deg,var(--azul),var(--violeta));
 color:white;
 text-decoration:none;
 padding:14px 26px;
 border-radius:10px;
 font-weight:bold;
}

.filtros{
 display:flex;
 flex-wrap:wrap;
 gap:10px;
 margin-bottom:25px;
}

.filtro{
 background:white;
 border:none;
 padding:10px 18px;
 border-radius:8px;
 cursor:pointer;
}

input[type=text]{
 width:100%;
 padding:14px;
 border:none;
 border-radius:10px;
 margin-bottom:20px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
 gap:20px;
}

.local{
 background:white;
 border-radius:15px;
 overflow:hidden;
 box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.local img{
